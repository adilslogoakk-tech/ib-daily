<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mandate">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Mandate</title>
<script src="theme.js"></script>
<style>
/* ===== темы: базовые цвета; всё остальное считается из них ===== */
:root{ /* Светлая (по умолчанию) */
  --bg:#f5f3ee; --card:#ffffff; --line:#e3dfd5; --text:#1b1d22; --mute:#6b6f78; --gold:#1b1d22; --on:#ffffff;
  --c-val:#c9531a; --c-cap:#1f6fb2; --c-prof:#26804f; --c-deal:#7444c2; --green:#26804f; --red:#d64545; --shadow:#1b1d2214; --sbar:#1b1d22;
  color-scheme:light;
}
:root[data-theme=mandate]{ --sbar:var(--bg); --bg:#1b1d22; --card:#24272d; --line:#353941; --text:#f5f3ee; --mute:#9b9fa7; --gold:#e8854a; --on:#1b1d22;
  --c-val:#e8854a; --c-cap:#6fb7e8; --c-prof:#8fd19e; --c-deal:#c3a6f5; --green:#8fd19e; --red:#ef7b6e; --shadow:#00000066; color-scheme:dark; }
:root[data-theme=graphite]{ --sbar:var(--bg); --bg:#0e1013; --card:#181b20; --line:#272b32; --text:#eceef2; --mute:#8b919c; --gold:#eceef2; --on:#101216;
  --c-val:#ff9a62; --c-cap:#5ec8e5; --c-prof:#6fdc9c; --c-deal:#c39bff; --green:#6fdc9c; --red:#ef6b6b; --shadow:#00000066; color-scheme:dark; }
:root[data-theme=emerald]{ --sbar:var(--bg); --bg:#0a1411; --card:#12201b; --line:#1f342c; --text:#e8f2ee; --mute:#85a398; --gold:#3ecf8e; --on:#06150e;
  --c-val:#ff8a7a; --c-cap:#7cc4ff; --c-prof:#b8a4ff; --c-deal:#ff9ec7; --green:#3ecf8e; --red:#ff7b7b; --shadow:#00000066; color-scheme:dark; }
:root[data-theme=bordeaux]{ --sbar:var(--bg); --bg:#130a0d; --card:#1d1216; --line:#33202a; --text:#f4ebee; --mute:#a58b94; --gold:#f0a8b4; --on:#2a0c14;
  --c-val:#ffb089; --c-cap:#5fd1c4; --c-prof:#a6d98a; --c-deal:#c0a6ff; --green:#a6d98a; --red:#ff8383; --shadow:#00000066; color-scheme:dark; }
:root[data-theme=violet]{ --sbar:var(--bg); --bg:#0e0c19; --card:#171428; --line:#272240; --text:#ece9fa; --mute:#9a94bd; --gold:#8b7dff; --on:#0d0a24;
  --c-val:#ff9a8a; --c-cap:#5fd6e0; --c-prof:#78e0a8; --c-deal:#ff8fc7; --green:#78e0a8; --red:#ff8383; --shadow:#00000066; color-scheme:dark; }
:root{
  --r:20px; --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif; --serif:var(--sans);
  --card2:color-mix(in srgb,var(--card) 65%,var(--bg)); --soft:color-mix(in srgb,var(--card) 70%,var(--bg));
  --track:color-mix(in srgb,var(--line) 75%,var(--card)); --text2:color-mix(in srgb,var(--text) 88%,var(--bg));
  --expl:color-mix(in srgb,var(--soft) 55%,var(--line)); --gold2:color-mix(in srgb,var(--gold) 86%,var(--bg));
  --ok-bg:color-mix(in srgb,var(--green) 16%,var(--card)); --bad-bg:color-mix(in srgb,var(--red) 14%,var(--card));
  --done-line:color-mix(in srgb,var(--green) 45%,var(--card)); --done-ic:color-mix(in srgb,var(--green) 26%,var(--card));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));
  background:radial-gradient(900px 500px at 80% -10%,color-mix(in srgb,var(--card) 60%,transparent),transparent),var(--bg)}
main{max-width:560px;margin:0 auto;padding:18px 18px 8px;position:relative}
h1,h2,h3{font-weight:600;margin:0;letter-spacing:-.02em}
h1{font-size:26px;line-height:1.1;padding-right:52px}
h2{font-size:19px;margin-bottom:10px}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:0 10px 30px var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--track);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text)}
.gold{color:var(--gold)}
.mute{color:var(--mute)}
.small{font-size:13px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{width:100%;padding:15px;border-radius:16px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--on);font-weight:600;font-size:16px;margin-top:12px;box-shadow:0 8px 22px var(--shadow)}
.btn.ghost{background:var(--track);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn[disabled]{opacity:.45}
/* нажатия */
.btn,.opt,.step,.st,.chip,.jh,.theme,.pill,.avatar,nav button,.card[data-go]{transition:transform .14s cubic-bezier(.3,1.4,.5,1),background-color .25s,color .25s,border-color .25s}
.btn:active,.opt:active,.step:active,.st:active,.chip:active,.jh:active,.theme:active,.pill:active,.avatar:active,.card[data-go]:active{transform:scale(.96)}
nav button:active{transform:scale(.88)}
/* нижняя панель */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:11px;font-weight:600;padding:6px 6px;border-radius:12px;min-width:56px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
nav button.on svg{animation:navpop .5s cubic-bezier(.3,1.7,.5,1)}
/* профиль */
.avatar{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--on);font-weight:700;font-size:17px;display:grid;place-items:center;box-shadow:0 6px 16px var(--shadow);z-index:2}
.avatar.big{position:relative;top:auto;right:auto;width:64px;height:64px;font-size:24px;flex:none;cursor:pointer}
.avatar .cam{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--card);color:var(--text);border:1px solid var(--line);font-size:11px;display:grid;place-items:center}
#sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--sbar);z-index:101;pointer-events:none}
/* кольцо */
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:var(--track)}.ring .fg{stroke:var(--gold);stroke-linecap:round}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:24px;font-weight:600}
/* шаги */
.step{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--soft);margin-top:10px;cursor:pointer}
.step .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--track);font-size:20px;flex:none}
.step.done{border-color:var(--done-line);background:var(--ok-bg)}
.step.done .ic{background:var(--done-ic)}
.step .t{font-weight:600}
.chk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.done .chk{background:var(--green);border-color:var(--green);color:var(--bg);font-weight:900}
.flame{display:inline-block}
/* активность */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--track)}
.heat i.l1{background:color-mix(in srgb,var(--gold) 25%,var(--track))}.heat i.l2{background:color-mix(in srgb,var(--gold) 55%,var(--track))}.heat i.l3{background:var(--gold)}
/* тесты */
.opt{display:block;width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;font-size:16px;color:var(--text)}
.opt.ok{background:var(--ok-bg);border-color:var(--green)}
.opt.bad{background:var(--bad-bg);border-color:var(--red)}
.opt.sel{border-color:var(--gold);background:var(--expl)}
.bar{height:6px;background:var(--track);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s;transform-origin:left}
.explain{margin-top:12px;padding:12px;border-radius:12px;background:var(--expl);border-left:3px solid var(--gold);font-size:14px;line-height:1.5}
.lesson-card{font-size:18px;line-height:1.55;color:var(--text2);min-height:200px;display:flex;align-items:center}
.flash{perspective:900px}
.flash .in{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:18px;line-height:1.5;color:var(--text2);cursor:pointer}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}
.news{display:block;color:inherit;text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line)}
.news:last-child{border:0}
.news b{font-weight:500;display:block;line-height:1.35;margin:4px 0}
.goal{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border:0}
.goal .chk{margin:0;cursor:pointer}
.goal.done span{text-decoration:line-through;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{font-weight:600;font-size:24px;display:block}
input[type=text],input[type=password],input[type=time],input[type=date],select{width:100%;background:var(--soft);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
/* iOS: поля даты и времени имеют свою минимальную ширину и выпирают из сетки, поэтому сбрасываем */
.grid2>*,.row>*{min-width:0}
input,select{max-width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;display:block;height:46px;line-height:1.2;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--gold);color:var(--on);font-weight:700;padding:10px 16px;border-radius:99px;z-index:60;box-shadow:0 10px 30px var(--shadow);animation:toast .45s cubic-bezier(.3,1.5,.5,1)}
.banner{background:linear-gradient(135deg,color-mix(in srgb,var(--bg) 55%,var(--line)),var(--bg));border:1px solid var(--line)}
.ticker{display:flex;gap:10px;overflow:auto;scrollbar-width:none}
.ticker div{flex:none;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:92px}
.ticker b{display:block;font-weight:600;font-size:17px}
.k{font-weight:600;border-radius:6px;padding:0 4px;white-space:nowrap}
.k-val{color:var(--c-val);background:color-mix(in srgb,var(--c-val) 14%,transparent)}.k-cap{color:var(--c-cap);background:color-mix(in srgb,var(--c-cap) 14%,transparent)}
.k-prof{color:var(--c-prof);background:color-mix(in srgb,var(--c-prof) 14%,transparent)}.k-deal{color:var(--c-deal);background:color-mix(in srgb,var(--c-deal) 14%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:8px}.legend .k{padding:5px 10px;border-radius:99px;font-size:13px}
.job{border-bottom:1px solid var(--line)}.job:last-child{border:0}
.jh{display:flex;gap:12px;align-items:center;padding:13px 0;cursor:pointer}
.jt{font-weight:500;line-height:1.35;margin-top:2px}
.match{font-weight:600;font-size:18px;color:var(--green);flex:none}.match small{font-size:11px}
.new{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--bg);background:var(--c-deal);border-radius:5px;padding:1px 5px;vertical-align:1px}
.jb{padding:0 0 14px}.jb p{margin:4px 0;line-height:1.45}
.sts{display:flex;flex-wrap:wrap;gap:8px}
.st,.chip{background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:500;color:var(--text)}
.st.on,.chip.on{background:var(--gold);color:var(--on);border-color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px 0 4px;padding-bottom:2px}.chip{flex:none;white-space:nowrap}
.chip b{opacity:.6;font-weight:500;margin-left:2px}
#jq{margin-top:4px}
.dots{display:flex;gap:8px}.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}.dots i.on{background:var(--green);border-color:var(--green)}
.why{font-size:12px;color:var(--mute);margin-bottom:6px}
.diag{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.plan{margin-top:8px;padding:8px 10px;background:var(--expl);border-radius:10px}
.pl{font-size:13px;line-height:1.45;margin:4px 0}
.pl.now{background:var(--card);border-left:3px solid var(--c-val);padding:2px 6px}
.chkrow{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:12px 0 0;line-height:1.4}
.chkrow input{margin-top:2px;flex:none}
.lb{margin:0 0 4px 2px}
/* собеседование, follow-up, недельный отчёт */
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gr button{padding:14px 6px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-weight:600;font-size:14px;color:var(--text)}
.gr .g0{border-color:var(--red);color:var(--red)}.gr .g1{border-color:var(--c-val);color:var(--c-val)}.gr .g2{border-color:var(--green);color:var(--green)}
.gr button:active{transform:scale(.95)}
.over{color:var(--red)}
.tpl{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tpl textarea{width:100%;margin:10px 0;background:var(--soft);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:14px;line-height:1.5;font-family:inherit;resize:none}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{padding:5px 12px;font-size:12px;font-weight:600;background:var(--soft);color:var(--text)}.seg button.on{background:var(--gold);color:var(--on)}
.dl{display:block;font-size:12px;margin-top:2px;color:var(--mute)}.dl.up,.up{color:var(--green)}.dl.dn,.dn{color:var(--red)}
.ring .fg{transition:stroke-dashoffset .3s linear}
/* термины, закладки, книга */
.k[data-term]{cursor:pointer;border-bottom:1px dotted currentColor}
.lrow{margin:10px 0 0}.lrow .st{font-size:12px}.st.later.on{background:var(--gold);color:var(--on);border-color:var(--gold)}
.pill.on{background:var(--gold);color:var(--on);border-color:var(--gold)}
#sheet{position:fixed;inset:0;z-index:80;pointer-events:none}
#sheet .sh-bg{position:absolute;inset:0;background:#0000;transition:background .28s}
#sheet.open{pointer-events:auto}#sheet.open .sh-bg{background:#00000059}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px var(--shadow);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.3,1)}
#sheet.open .sh{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.fml{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--expl);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
.seg.wide{margin:14px 0 4px}.seg.wide button{flex:1;padding:9px 12px;font-size:14px}
.cn{width:30px;height:30px;border-radius:10px;background:var(--track);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.rbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top);height:3px;background:transparent;z-index:60}.rbar i{display:block;height:100%;width:0;background:var(--gold)}
.book{font-family:Georgia,"Times New Roman","Noto Serif",serif;font-size:var(--fs,17px);line-height:1.75;color:var(--text2)}
.book.sans{font-family:var(--sans)}
.book p{margin:0 0 1em}.book .lead{font-size:1.06em;color:var(--text);border-left:3px solid var(--gold);padding-left:12px}
.book .bt{font-family:var(--sans);font-size:28px;line-height:1.15;margin:6px 0 4px;padding:0}
.book .bh{font-family:var(--sans);font-size:1.15em;margin:1.6em 0 .5em;color:var(--text)}
.book ul,.book ol{margin:0 0 1em;padding-left:1.3em}.book li{margin:0 0 .4em}
.bx{margin:1.2em 0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-size:.96em;line-height:1.65}
.bx p{margin:0 0 .6em}.bx p:last-child{margin:0}
.bxt{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;color:var(--mute)}
.bx.key{border-left:4px solid var(--green)}.bx.key .bxt{color:var(--green)}
.bx.warn{border-left:4px solid var(--red)}.bx.warn .bxt{color:var(--red)}
.bx.ex{border-left:4px solid var(--c-cap)}.bx.ex .bxt{color:var(--c-cap)}
.bx.q{border-left:4px solid var(--c-deal)}.bx.q .bxt{color:var(--c-deal)}
.tw{overflow-x:auto;margin:1em 0}.book table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:.85em}
.book th{text-align:left;padding:7px 8px;background:var(--track);border-bottom:1px solid var(--line)}.book td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.bend{margin:2em 0 1em;font-family:var(--sans)}
.offline{color:var(--red)}
/* настройки */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:12px;font-weight:600;color:var(--text)}
.theme.on{border-color:var(--gold)}
.theme .sw{height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:4px;border:1px solid #8884}
.theme .sw i{width:14px;height:14px;border-radius:50%}
.theme .sw b{width:8px;height:8px;border-radius:50%}
.theme .auto{background:linear-gradient(90deg,#f5f3ee 50%,#0e1013 50%)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tg{-webkit-appearance:none;appearance:none;flex:none;width:50px;height:30px;border-radius:99px;background:var(--track);border:1px solid var(--line);position:relative;margin:0;cursor:pointer;transition:background-color .25s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 4px var(--shadow);transition:transform .28s cubic-bezier(.3,1.5,.5,1),background-color .25s}
.tg:checked{background:var(--gold)}.tg:checked::after{transform:translateX(20px);background:var(--on)}
/* заставка и конфетти */
#splash{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;transition:opacity .55s ease,visibility .55s}
#splash.hide{opacity:0;visibility:hidden}
#splash{grid-template-rows:auto auto auto;align-content:center;justify-items:center}
#splash .mark{width:96px;height:96px;border-radius:27px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--on);display:grid;place-items:center;box-shadow:0 18px 44px var(--shadow);animation:markin .8s cubic-bezier(.2,1.5,.4,1) both}
#splash .mark svg{width:58px;height:auto}
#splash .nm{margin-top:18px;font-size:26px;font-weight:700;letter-spacing:-.02em;animation:rise .6s .25s cubic-bezier(.2,.8,.2,1) both}
#splash .by{margin-top:2px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);animation:rise .6s .35s cubic-bezier(.2,.8,.2,1) both}
#splash .ln{position:absolute;bottom:22%;width:90px;height:3px;border-radius:3px;background:var(--track);overflow:hidden}
#splash .ln::after{content:'';display:block;height:100%;width:40%;border-radius:3px;background:var(--gold);animation:slide 1s ease-in-out infinite}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
/* плавная смена темы */
html.themeswap *{transition:background-color .45s,color .45s,border-color .45s,fill .45s,stroke .45s,box-shadow .45s!important}
/* ===== анимации ===== */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes toast{from{opacity:0;transform:translate(-50%,-18px) scale(.9)}}
@keyframes markin{from{opacity:0;transform:scale(.55) rotate(-8deg)}}
@keyframes slide{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes navpop{0%{transform:scale(.7) translateY(4px)}100%{transform:none}}
@keyframes ring{from{stroke-dashoffset:var(--circ)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes okpulse{0%{transform:scale(1)}40%{transform:scale(1.025);box-shadow:0 0 0 6px color-mix(in srgb,var(--green) 25%,transparent)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes flip{from{opacity:.2;transform:rotateY(88deg)}to{opacity:1;transform:none}}
@keyframes checkpop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:none}25%{transform:rotate(-14deg) scale(1.15)}60%{transform:rotate(10deg) scale(1.1)}}
#app.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#app.enter>:nth-child(2){animation-delay:.05s}#app.enter>:nth-child(3){animation-delay:.1s}#app.enter>:nth-child(4){animation-delay:.15s}
#app.enter>:nth-child(5){animation-delay:.2s}#app.enter>:nth-child(6){animation-delay:.25s}#app.enter>:nth-child(7){animation-delay:.3s}
#app.enter>:nth-child(8){animation-delay:.35s}#app.enter>:nth-child(9){animation-delay:.4s}#app.enter>:nth-child(n+10){animation-delay:.45s}
#app.enter .step{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#app.enter .step:nth-of-type(1){animation-delay:.25s}#app.enter .step:nth-of-type(2){animation-delay:.33s}#app.enter .step:nth-of-type(3){animation-delay:.41s}
#app.enter .ring .fg{animation:ring 1.2s .25s cubic-bezier(.3,.7,.2,1) both}
#app.enter .bar i{animation:grow .9s .2s cubic-bezier(.3,.7,.2,1) both}
#app.enter .heat i{animation:fade .8s .3s both}
#app.enter .flame{animation:wiggle 1s .5s ease-in-out 2}
.step.done .chk{animation:checkpop .5s .35s cubic-bezier(.3,1.7,.5,1) both}
.opt.ok{animation:okpulse .55s ease-out}
.opt.bad{animation:shake .45s}
.explain,.diag{animation:rise .4s .1s cubic-bezier(.2,.8,.2,1) both}
.flash .in.flip{animation:flip .4s cubic-bezier(.2,.8,.2,1)}
/* отключение: из настроек или системой («уменьшить движение») */
/* переключение внутри экрана (сегменты, язык), списки и удаление */
@keyframes segin{from{opacity:0}}
@keyframes push{from{opacity:0;transform:translateX(26px)}}
@keyframes pull{from{opacity:0;transform:translateX(-26px)}}
.push{animation:push .28s ease-out}.pull{animation:pull .28s ease-out}
@keyframes segon{from{transform:scale(.9)}}
@keyframes itemin{from{transform:translateX(-8px)}}
@keyframes itemout{to{opacity:0;transform:translateX(24px) scale(.97);max-height:0;margin:0;padding-top:0;padding-bottom:0}}
.seg button{transition:background-color .25s,color .25s,transform .2s}.seg button:active{transform:scale(.94)}
#app.sub .seg~*{animation:segin .16s ease-out}
.card.out{animation:itemout .28s ease-in forwards;overflow:hidden}
.rbar i{transition:width .25s ease-out}
.card[data-act]{transition:transform .14s cubic-bezier(.3,1.4,.5,1),background-color .25s}.card[data-act]:active,.goal.chap:active{transform:scale(.97)}
#app.enter .goal.done .chk{animation:checkpop .4s .3s cubic-bezier(.3,1.7,.5,1) both}
html[data-anim=off] *,html[data-anim=off] *::before,html[data-anim=off] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
